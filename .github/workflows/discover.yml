name: Discover releases

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

concurrency:
  group: discover-releases
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Pull latest main
        run: git pull --ff-only origin main
      - name: Discover and verify releases
        id: discovery
        shell: bash
        run: |
          set -euo pipefail
          for script in discover/discover-*.sh; do
            echo "Running $script"
            version=$("$script")
            [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid discovered version: $version" >&2; exit 1; }
            echo "Discovered $version"
            if [[ -n $(git status --porcelain -- metadata) ]]; then
              tool=${script#discover/discover-}
              tool=${tool%.sh}
              printf 'tool=%s\nversion=%s\n' "$tool" "$version" >> "$GITHUB_OUTPUT"
              echo "New metadata found by $script; leaving remaining tools for a later run."
              break
            fi
          done
      - name: Commit metadata to main
        shell: bash
        env:
          DISCOVERED_TOOL: ${{ steps.discovery.outputs.tool }}
          DISCOVERED_VERSION: ${{ steps.discovery.outputs.version }}
        run: |
          set -euo pipefail
          git add -- metadata
          if git diff --cached --quiet; then
            echo 'No new release metadata.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update: $DISCOVERED_TOOL $DISCOVERED_VERSION"
          git push origin HEAD:main
